# Site-wide settings. Restart `jekyll serve` after editing this file.
title: Tádé Marozsák              # your name as the site shows it (home page, tab)
tagline: PhD Candidate            # used in the home page <title>
author: Tade Marozsak             # as printed on your papers; highlighted in publication author lists
orcid: 0009-0008-4144-3920        # publications come from here (_tools/publications.rb)
google_scholar: AH-frOoAAAAJ      # linked from /publications/
description: Personal academic website of Tádé Marozsák, a PhD student at MIT.
url: https://tademarozsak.github.io
lang: en

markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"  # text-style ↩ (stops iOS drawing it as an emoji)
theme: null                       # GitHub Pages otherwise injects its default "primer" theme

# Research projects: one file each in _projects/ (card text, image, order).
# Each becomes a page at /research/<file name>/, drawn by _layouts/project.html.
collections:
  projects:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      title: Research

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv
